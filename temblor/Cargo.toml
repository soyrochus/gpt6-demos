[package]
name = "temblor"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust-based engine for playing Quake III Arena maps in a browser"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam = "0.30"
zip = { version = "2.4.2", default-features = false, features = ["flate2", "deflate-flate2"] }
image = {version = "0.25", default-features = false, features = ["jpeg","png","tga"]}
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_arch="wasm32")'.dependencies]
wgpu = {version = "24", default-features = false, features = ["webgpu","wgsl"]}
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "=0.4.64"
web-sys = {version = "=0.3.91", features=["HtmlCanvasElement","console"]}
js-sys = "=0.3.91"
console_error_panic_hook = "0.1"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
