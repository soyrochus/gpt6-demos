async function libraries(){

    // A compressed, pinned copy keeps file:// usable when the CDN is unavailable.
    const data=Uint8Array.from(atob(document.querySelector('#offline').textContent.trim()),c=>c.charCodeAt(0));
    const source=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).blob();
    const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
    try{return await import(url)}finally{URL.revokeObjectURL(url)}

function start({T,EffectComposer,RenderPass,UnrealBloomPass,OutputPass}){

// Instanced polyhedra use smooth gradient (Perlin) noise. Barycentric edge

const vertex=`
uniform float tm;uniform float stone;uniform float drift;
attribute vec3 bary;varying vec3 bc,wp,col;varying float depth;

 p*=1.+mix(.22,.062,stone)*noise3(p*1.4+instanceMatrix[3].xyz*.47+vec3(tm*.37,0.,0.));
 // The crystal banks breathe in broad waves. Loose shards hover and roll
 // farther on their own paths. Both offsets are in world units.
 vec3 anchor=instanceMatrix[3].xyz;
 float phase=.29*anchor.x+.17*anchor.z;
 float tilt=drift*.085*sin(tm*.31+phase);

 world.xyz+=drift*vec3(.36*sin(tm*.27+phase),.62*sin(tm*.38+phase),.23*cos(tm*.23+phase));

const fragment=`
uniform float tm,stone;uniform vec3 lightA,lightB,posA,posB;varying vec3 bc,wp,col;varying float depth;
void main(){vec3 n=normalize(cross(dFdx(wp),dFdy(wp))),v=normalize(cameraPosition-wp),r=reflect(-v,n);

fragments.boundingSphere.radius+=2;
const ground=new T.PlaneGeometry(150,155,60,55);ground.rotateX(-Math.PI/2);const gp=ground.attributes.position;
for(let i=0;i<gp.count;i++)gp.setY(i,-6.4+rand()*1.35);ground.computeVertexNormals();
const floor=new T.Mesh(ground,new T.MeshPhongMaterial({color:0x144455,specular:0x73d4c4,shininess:48,flatShading:true}));floor.position.z=-24;scene.add(floor,new T.AmbientLight(0x6089bc,.65));

 for(let j=0;j<3;j++){const a=j*TAU/3+.52;

const vg=new T.BufferGeometry();vg.setAttribute('position',new T.Float32BufferAttribute(veins,3));vg.setAttribute('color',new T.Float32BufferAttribute(veinColors,3));

// Low-frequency auroral bands give the dark vault depth between crystal clusters.
const sky=new T.Mesh(new T.SphereGeometry(145,32,24),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,uniforms:{tm:clock},
vertexShader:`varying vec3 ray;void main(){ray=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`varying vec3 ray;uniform float tm;void main(){vec3 d=normalize(ray);float fold=d.y+.12*sin(5.*d.x+2.*d.z+tm*.023)+.055*sin(11.*d.x-4.*d.z);

// Repeating star polygons and interlaced petals form a spatial rose window.
const gateway=new T.Group();gateway.position.set(0,2.15,-38);scene.add(gateway);
const rosettes=[];
function rose(rad,z,layer){const positions=[],colors=[];

 function path(points,c){for(let j=1;j<points.length;j++)line(...points[j-1],...points[j],c)}
 const xy=(r,a)=>[r*Math.cos(a),r*Math.sin(a)],mint=new T.Color('#79f7d6').multiplyScalar(.85),blue=new T.Color('#4bb2cd'),gold=new T.Color('#f7cb87');
 for(let i=0;i<24;i++){const a=i*TAU/24,d=TAU/24;

 }

const elves=[];
const liveries=[
